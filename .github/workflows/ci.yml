name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,stripe]" || pip install -e ".[stripe]"
          pip install ruff pytest pytest-asyncio httpx || true
      - name: Ruff (if available)
        run: |
          if command -v ruff >/dev/null 2>&1; then
            ruff check app || true
          else
            echo "ruff not installed — skip"
          fi
      - name: Import smoke
        env:
          SECRET_KEY: ci-secret-key-at-least-32-characters-long!!
          ADMIN_SECRET_KEY: ci-admin-secret-key-at-least-32-chars!!
          DATABASE_URL: postgresql+asyncpg://anylang:anylang@localhost:5432/anylang
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: local
          DEBUG: "true"
        run: python -c "from app.main import app; print('app_ok', app.title)"

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install
        run: npm ci || npm install
      - name: Lint / typecheck
        run: |
          npm run lint --if-present || true
          npx tsc -p tsconfig.json --noEmit || true
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://anylang.uz
          ADMIN_BASE_PATH: /admin
          NEXT_PUBLIC_BASE_PATH: /admin
        run: npm run build

  # Deploy is intentional / manual via scripts/ship_full_release.py
  # (SSH to production). Automate only after staging host exists.
