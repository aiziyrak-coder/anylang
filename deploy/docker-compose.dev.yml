# Development stack — SAME VPS as prod, isolated ports/volumes/DB.
# Does NOT touch production containers (project name: anylang-dev).
#
# Start:
#   cd /home/admin_root/anylang/deploy
#   docker compose -f docker-compose.dev.yml --env-file .env.dev up -d --build
#
# Public: https://dev.anylang.uz  (nginx → 127.0.0.1:8205)
name: anylang-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anylang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: anylang_dev
    volumes:
      - anylang_dev_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:25433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anylang -d anylang_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
        redis-server --requirepass "$$REDIS_PASSWORD";
      else
        redis-server;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:26380:6379"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - anylang_dev_minio:/data
    ports:
      - "127.0.0.1:29002:9000"
      - "127.0.0.1:29003:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb -p local/anylang-dev || true;
      mc anonymous set download local/anylang-dev/public || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      DATABASE_URL: postgresql+asyncpg://anylang:${POSTGRES_PASSWORD}@postgres:5432/anylang_dev
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      S3_ENDPOINT_URL: http://minio:9000
      APP_ENV: development
    ports:
      - "127.0.0.1:8205:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "40m"
        max-file: "7"
    command: >
      sh -c "alembic upgrade head &&
             gunicorn app.main:app -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 -w 2 --timeout 120 --graceful-timeout 30 --keep-alive 5"

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      DATABASE_URL: postgresql+asyncpg://anylang:${POSTGRES_PASSWORD}@postgres:5432/anylang_dev
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "5"
    command: arq app.workers.settings.WorkerSettings

  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://dev.anylang.uz
        ADMIN_BASE_PATH: /admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://dev.anylang.uz
      ADMIN_BASE_PATH: /admin
      NEXT_PUBLIC_BASE_PATH: /admin
      ADMIN_PUBLIC_ORIGINS: https://dev.anylang.uz
    ports:
      - "127.0.0.1:3205:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/admin/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

volumes:
  anylang_dev_pgdata:
  anylang_dev_minio:
