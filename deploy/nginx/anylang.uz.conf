# anylang.uz — production vhost (Certbot TLS). Do not overwrite without SSL blocks.
# Landing: /  |  Admin: /boshqaruv  |  API: /api/  |  WS: /ws

server {
    server_name anylang.uz www.anylang.uz;

    client_max_body_size 50M;

    # Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' wss: https:; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Public marketing site
    location / {
        root /var/www/anylang;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Language / country flags (cached by clients)
    location /flags/ {
        alias /var/www/anylang-flags/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        types { image/png png; }
        default_type image/png;
    }

    # Android test APK (Play Market chiqquncha)
    location /download/ {
        alias /var/www/anylang-apk/;
        autoindex off;
        types {
            application/vnd.android.package-archive apk;
            application/json json;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=60" always;
    }

    location = /download/anylang-latest.apk {
        alias /var/www/anylang-apk/anylang-latest.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="AnyLang.apk"' always;
        add_header Cache-Control "no-cache" always;
    }

    location = /download/latest.json {
        alias /var/www/anylang-apk/latest.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
    }

    # --- Admin panel (non-obvious path) ---
    # Must match deploy/.env ADMIN_BASE_PATH and Next.js basePath.
    location ^~ /boshqaruv {
        proxy_pass http://127.0.0.1:3105;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
    }

    # Old / obvious admin paths — look like "nothing here"
    location = /admin { return 404; }
    location /admin/ { return 404; }
    location = /admin/login { return 404; }
    location /administrator { return 404; }
    location /wp-admin { return 404; }
    location /ops-x7k2m9q4n8p3 { return 404; }
    location /ops-x7k2m9q4n8p3/ { return 404; }

    # FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8105/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket — FastAPI routes: /ws and /ws/
    location = /ws {
        proxy_pass http://127.0.0.1:8105;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
    location = /ws/ {
        proxy_pass http://127.0.0.1:8105;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Health / readiness / lightweight metrics
    location = /health {
        proxy_pass http://127.0.0.1:8105/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:8105/ready;
        proxy_set_header Host $host;
        access_log off;
    }

    location = /metrics/basic {
        proxy_pass http://127.0.0.1:8105/metrics/basic;
        proxy_set_header Host $host;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    # Click / payment return pages (FastAPI HTML)
    location = /billing/success {
        proxy_pass http://127.0.0.1:8105/billing/success;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /billing/cancel {
        proxy_pass http://127.0.0.1:8105/billing/cancel;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /payment/success {
        proxy_pass http://127.0.0.1:8105/payment/success;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /payment/cancel {
        proxy_pass http://127.0.0.1:8105/payment/cancel;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO public media
    location /media/ {
        proxy_pass http://127.0.0.1:19002/anylang/;
        proxy_set_header Host 127.0.0.1:19002;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/anylang.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/anylang.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.anylang.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = anylang.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name anylang.uz www.anylang.uz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    return 404; # managed by Certbot
}
